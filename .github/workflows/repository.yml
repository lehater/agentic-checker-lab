name: repository

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate documentation map and required files
        run: python3 tools/check_repository.py
      - name: Check Ubuntu smoke script syntax
        run: |
          bash -n tools/harness_smoke.sh
          bash -n tools/cmind_preflight.sh
          bash -n tools/cmind_codex_pr96_smoke.sh

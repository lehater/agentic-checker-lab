name: repository

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Verify repository and Checker
        run: make check
      - name: Check Ubuntu smoke script syntax
        run: |
          bash -n tools/harness_smoke.sh
          bash -n tools/cmind_preflight.sh
          bash -n tools/cmind_codex_pr96_smoke.sh
          bash -n tools/cmind_codex_live_probe.sh
          bash -n tools/cmind_synthetic_rpg.sh
          bash -n tools/harness_consumer_preflight.sh
          bash -n tools/harness_pack_preflight.sh
          python3 -m py_compile .harness/harnessw.py
          python3 -m json.tool .harness/harness-binding.json > /dev/null
      - name: Check RPG audit syntax
        run: |
          python3 -m py_compile tools/audit_synthetic_rpg.py
          python3 tools/test_audit_synthetic_rpg.py

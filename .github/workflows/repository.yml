name: repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Docs, architecture and offline telemetry regressions
        run: make check
      - name: Historical tooling shell syntax
        run: |
          bash -n tools/harness_smoke.sh
          bash -n tools/cmind_preflight.sh
          bash -n tools/cmind_codex_pr96_smoke.sh
          bash -n tools/cmind_codex_live_probe.sh
          bash -n tools/cmind_synthetic_rpg.sh
          bash -n tools/harness_consumer_preflight.sh
          bash -n tools/harness_pack_preflight.sh
          python3 -m py_compile .harness/harnessw.py
          python3 -m json.tool .harness/harness-binding.json > /dev/null
      - name: Python tooling syntax and old RPG fixture
        run: |
          python3 -m py_compile tools/audit_synthetic_rpg.py tools/check_architecture.py tools/analyze_run.py tools/check_semantic_review.py tools/prepare_semantic_review.py tools/export_semantic_case.py tools/evaluate_semantic_reviewer.py tools/check_requirements_trace.py tools/compare_runs.py
          python3 tools/test_audit_synthetic_rpg.py

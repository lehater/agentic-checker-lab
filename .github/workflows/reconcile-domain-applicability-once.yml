name: One-shot Checker Domain applicability reconciliation

on:
  push:
    branches: [fix/domain-applicability-q-dv001]
    paths:
      - .github/workflows/reconcile-domain-applicability-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'lehater/agentic-checker-lab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Produce one validated Harness CAS publication
        run: |
          python3 .harness/harnessw.py sync
          python3 tools/reconcile_domain_applicability.py
          python3 tools/test_domain_applicability_reconciliation.py
          python3 tools/check_repository.py
      - name: Commit only reconciled canonical project truth
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .harness/engineering-graph.yaml .harness/project-publication.yaml .harness/authority-assessments.yaml docs/scenario/checker-scope-reconciliation.yaml docs/project/current-state.yaml
          git diff --cached --check
          git diff --cached --quiet && { echo "No canonical change"; exit 1; }
          git commit -m "fix(checker): publish scoped domain applicability reconciliation"
          git push origin HEAD:fix/domain-applicability-q-dv001

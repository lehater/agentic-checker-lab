name: Revised Product Requirements admission

on:
  pull_request:
    paths:
      - '.harness/**'
      - 'experiments/runs/harness-requirements-revision-v1/**'
      - '.github/workflows/requirements-revision.yml'

permissions:
  contents: read

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python3 -m pip install PyYAML==6.0.3
      - name: Execute real pinned Harness REVISION
        run: python3 experiments/runs/harness-requirements-revision-v1/execute.py
      - name: Validate repository
        run: make check
      - name: Emit deterministic admitted output for exact checked-in update
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('experiments/runs/harness-requirements-revision-v1')
          files={
              'publication': Path('.harness/project-publication.yaml').read_text(),
              'admission': (root/'semantic-admission.yaml').read_text(),
              'candidate': (root/'admission-candidate.yaml').read_text(),
          }
          print('CHECKER_REVISED_OUTPUT_JSON='+json.dumps(files,ensure_ascii=True,separators=(',',':')))
          PY
      - name: Require checked-in revision to equal real Harness publication and evidence
        run: |
          git diff --exit-code -- .harness/project-publication.yaml
          git diff --exit-code -- experiments/runs/harness-requirements-revision-v1/admission-candidate.yaml
          git diff --exit-code -- experiments/runs/harness-requirements-revision-v1/semantic-admission.yaml

knowledge_kind: test-design
depends_on:
- verification
- scenarios
- interface
- policy
- technical-verification
candidate:
  id: tests
  path: .harness/knowledge/tests.yaml
  capability: checker.tests
  canonical_references:
  - referenced_path: .harness/knowledge/verification.yaml
  - referenced_path: docs/checker/scenarios.yaml
  - referenced_path: docs/checker/interface.md
  - referenced_path: docs/checker/engineering-policy.md
  - referenced_path: .harness/knowledge/technical-verification.yaml
  semantic_assertions:
  - id: TD-BEHAVIOR
    kind: test-contract
    subject: TD-BEHAVIOR
    semantic_value: Run every scenario against the public CLI as an isolated process,
      with JSON output. Compare fixed expected IDs, actions, groups/status, complete
      original fields, placements, no verdict; errors exit 2 with empty stdout.
    decision_authority: TEST-DESIGN
    derived_from:
    - VC-INPUT
    - VC-MATCH
    - VC-CONTEXT
    - VC-EMPTY
    - SCENARIOS
    - IF-1
    - POL-1
  - id: TD-BOUNDARIES
    kind: test-contract
    subject: TD-BOUNDARIES
    semantic_value: Run text and JSON CLI, malformed JSON and shape/unsupported/absent
      data cases; inspect inner module imports. Text shows groups/rules/placements;
      JSON shape matches contract; bad data never becomes success; inner modules do
      not import outer adapters or network/filesystem modules.
    decision_authority: TEST-DESIGN
    derived_from:
    - VC-ARCH
    - VC-IF
    - IF-1
    - POL-1
  semantic_review:
    status: ACCEPTED
    checks:
    - source-discipline
    - authority-boundary
    - no-invention
    - test-not-semantic-owner
    reviewer: Engineering agent under current owner assignment
    record: .harness/knowledge/tests.yaml
    rationale: Все VC TEST checks покрыты public CLI контрактами. Fixed expected values
      остаются в scenarios, не вычисляются matcher. Interface/architecture assertions
      прямо из IF-1/ARCH-1 через policy. Две пары operation/oracle obligations machine-addressable;
      исполнения пока нет.

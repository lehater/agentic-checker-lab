knowledge_kind: component-design
depends_on:
- architecture
- interface
- domain
- policy
candidate:
  id: components
  path: docs/checker/components.md
  capability: checker.components
  canonical_references:
  - referenced_path: docs/checker/architecture.md
  - referenced_path: docs/checker/interface.md
  - referenced_path: docs/checker/domain.md
  - referenced_path: docs/checker/engineering-policy.md
  semantic_assertions:
  - id: COMP-1
    kind: component-design
    subject: COMP-1
    semantic_value: Pure matches, application check with relevance/snapshot callables,
      outer validation and CLI composition; invocation values and no shared mutable
      cache.
    decision_authority: COMPONENT-DESIGN
    derived_from:
    - ARCH-1
    - IF-1
    - DOM-1
    - DOM-2
    - POL-1
  semantic_review:
    status: ACCEPTED
    checks:
    - source-discipline
    - authority-boundary
    - no-invention
    - component-not-upstream-owner
    - implementation-facing-boundaries-complete-for-scope
    reviewer: Engineering agent under current owner assignment
    record: docs/checker/components.md
    rationale: Public contracts and ownership cover every use case collaborator without
      speculative class wrappers. Substitution seam exists for relevance and snapshot.
      Boundary mappings/errors preserve accepted semantics; deterministic import and
      public tests required. Options documented before candidate; private representation
      remains free.
  decision_review:
    axes:
    - axis: responsibility-boundaries
      decisions:
      - id: components
        owner_authority: COMPONENT-DESIGN
        alternatives:
        - id: functions
          state: VIABLE
        - id: objects
          state: VIABLE
        disposition: DELEGATED
        selected: functions
        rationale: Smaller stateless callable design satisfies current accepted contracts;
          no meaningful object lifetime/cache benefit.
    - axis: provider-seams
      decisions:
      - id: sources
        owner_authority: COMPONENT-DESIGN
        alternatives:
        - id: callables
          state: VIABLE
        - id: protocols
          state: VIABLE
        disposition: DELEGATED
        selected: callables
        rationale: Smaller stateless callable design satisfies current accepted contracts;
          no meaningful object lifetime/cache benefit.
    - axis: state-ownership
      decisions:
      - id: state
        owner_authority: COMPONENT-DESIGN
        alternatives:
        - id: invocation
          state: VIABLE
        - id: cache
          state: VIABLE
        disposition: DELEGATED
        selected: invocation
        rationale: Smaller stateless callable design satisfies current accepted contracts;
          no meaningful object lifetime/cache benefit.
decision_policy:
  version: 1
  kind: harness-decision-policy
  knowledge_kinds:
  - knowledge_kind: system-architecture
    exploration: EXPLORE
    autonomy: BROAD
    execution_assurance: REQUEST_BOUND
  - knowledge_kind: component-design
    exploration: EXPLORE
    autonomy: BROAD
    execution_assurance: REQUEST_BOUND
  - knowledge_kind: implementation-design
    exploration: EXPLORE
    autonomy: BROAD
    execution_assurance: REQUEST_BOUND
decision_exploration:
  axes:
  - axis: responsibility-boundaries
    applicability: APPLICABLE
    exploration_level: EXPLORE
    probes:
    - strategy: split-vs-merge
      challenge: Would merging matching and I/O hide independent change?
      alternatives:
      - functions
      - objects
      decision_points:
      - components
    - strategy: feature-vs-technical
      challenge: Would service base classes add current sharing value?
      alternatives:
      - functions
      - objects
      decision_points:
      - components
    decision_points:
    - id: components
      alternatives:
      - id: functions
        difference: Small matching, use-case, boundary function modules.
        material_effects:
          boundary-granularity: cohesive-functions
          ownership-basis: semantic-responsibility
          cross-feature-sharing: none
      - id: objects
        difference: Object graph with one service class per operation.
        material_effects:
          boundary-granularity: service-classes
          ownership-basis: operation-object
          cross-feature-sharing: service-base
  - axis: provider-seams
    applicability: APPLICABLE
    exploration_level: EXPLORE
    probes:
    - strategy: direct-vs-port
      challenge: Can replacing sources avoid touching matching?
      alternatives:
      - callables
      - protocols
      decision_points:
      - sources
    - strategy: provider-substitution
      challenge: Would object lifetime/state be meaningful here?
      alternatives:
      - callables
      - protocols
      decision_points:
      - sources
    decision_points:
    - id: sources
      alternatives:
      - id: callables
        difference: Use case accepts narrow relevance and snapshot functions.
        material_effects:
          seam-location: application-parameters
          provider-leakage: none
          substitution-scope: source-callable
      - id: protocols
        difference: Use case accepts two explicit provider objects.
        material_effects:
          seam-location: provider-interface
          provider-leakage: none
          substitution-scope: provider-object
  - axis: state-ownership
    applicability: APPLICABLE
    exploration_level: EXPLORE
    probes:
    - strategy: local-vs-global
      challenge: Does global snapshot cache need invalidation?
      alternatives:
      - invocation
      - cache
      decision_points:
      - state
    - strategy: lifecycle-perturbation
      challenge: Does one query require longer-lived state?
      alternatives:
      - invocation
      - cache
      decision_points:
      - state
    decision_points:
    - id: state
      alternatives:
      - id: invocation
        difference: Validated values owned by each invocation.
        material_effects:
          state-owner: invocation
          sharing-scope: none
          lifecycle: query
      - id: cache
        difference: Shared cache of normalized snapshot values.
        material_effects:
          state-owner: cache
          sharing-scope: multiple-queries
          lifecycle: process
  decision_space_review:
    status: COMPLETE
    checks:
    - mixed-decision-split
    - missing-material-case-search
    - impact-and-reversal-frontier-check
    - accepted-constraint-cross-check
    - authority-boundary-cross-check
    reviewed_decisions:
    - components
    - sources
    - state
    open_gaps: []
    rationale: Checked public responsibilities, substitution and state lifetimes;
      matching/representation boundaries already accepted, language/private helpers
      remain free. No additional lifecycle or state identity.
  version: 1
  kind: harness-decision-exploration
  capability: checker.components
  knowledge_kind: component-design
  explorer_request_id: sha256:9544de9d72fa537cd323bffc8a79ac4c30e82ca59cdbbe5d7c19a854d3675175

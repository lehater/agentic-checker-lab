    questions:
    - id: Q-PR-001
      authority: PRODUCT-REQUIREMENTS
      text: 'Какой минимальный наблюдаемый scope первого Checker принимается: какие
        потоки и policy contexts поддерживаются, какие сведения считаются входом/обязательным
        результатом и по каким продуктовым условиям placements/правила считаются релевантными/подходящими?
        Необходима граница, не выбор алгоритма, интерфейса или архитектуры.'
      blocks_capabilities:
      - checker.requirements
      blocks: []
      answer_from: []
      resolution:
        artifact: CHECKER-REQUIREMENTS
        acceptance_id: task-004-requirements-revised-e6b9bb836bc43b75a26fcebc
        supersedes_acceptance_id: task-004-requirements-revised-508d09a81929c4b2257bb8fa
    - id: Q-PR-002
      authority: PRODUCT-REQUIREMENTS
      text: Как оператор должен различать надёжные, неизвестные, неполные или устаревшие
        свидетельства и какой результат считается допустимым при отсутствующих/недостоверных
        источниках в scope Q-PR-001? Определить наблюдаемые условия приёмки без придуманных
        порогов freshness и без универсального verdict.
      blocks_capabilities:
      - checker.requirements
      blocks: []
      answer_from: []
      resolution:
        artifact: CHECKER-REQUIREMENTS
        acceptance_id: task-004-requirements-revised-e6b9bb836bc43b75a26fcebc
        supersedes_acceptance_id: task-004-requirements-revised-508d09a81929c4b2257bb8fa
    - id: Q-DV-002
      authority: DOMAIN-USE-CASE-DESIGN
      text: Какие конкретные поддерживаемые ACL facts и match/non-match predicates
        применимы к входному IPv4 TCP/UDP потоку (оба адреса и оба порта), как интерпретируется
        известный порядок показываемых правил внутри context и где проходит граница
        unknown/unsupported фактов? Нужны независимо обоснованные положительные и
        отрицательные ожидаемые примеры. Syntax/masks, implicit deny, first-match,
        action priority, глобальный Permit/Deny и алгоритм не приняты.
      blocks_capabilities:
      - checker.domain-use-case
      - checker.verification-strategy
      blocks: []
      answer_from: []
